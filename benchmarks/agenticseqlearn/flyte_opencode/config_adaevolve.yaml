# AdaEvolve configuration for evolving ps-agenticseqlearn's OpenCode program.md.
#
# Usage:
#   uv run skydiscover-run benchmarks/agenticseqlearn/flyte_opencode/initial_program.md \
#     benchmarks/agenticseqlearn/flyte_opencode/evaluator.py \
#     -c benchmarks/agenticseqlearn/flyte_opencode/config_adaevolve.yaml \
#     --search adaevolve -i 10

max_iterations: 50
checkpoint_interval: 1
log_level: "INFO"
diff_based_generation: false
max_solution_length: 20000
language: "text"
file_suffix: ".md"

llm:
  models:
    - name: "gpt-5-mini"
      weight: 1.0
  api_base: "https://api.openai.com/v1"
  temperature: 0.7
  max_tokens: 16000
  timeout: 300

search:
  type: adaevolve
  num_context_programs: 4
  database:
    population_size: 20
    num_islands: 2
    migration_interval: 10
    migration_count: 5
    decay: 0.9
    intensity_min: 0.15
    intensity_max: 0.5
    use_unified_archive: true
    fitness_weight: 1.0
    novelty_weight: 0.0
    diversity_strategy: text
    use_adaptive_search: true
    use_ucb_selection: true
    use_migration: true
    use_dynamic_islands: true
    max_islands: 5
    spawn_productivity_threshold: 0.015
    spawn_cooldown_iterations: 30
    use_paradigm_breakthrough: true
    paradigm_window_size: 10
    paradigm_improvement_threshold: 0.12
    paradigm_max_uses: 2
    paradigm_max_tried: 10
    paradigm_num_to_generate: 3
    enable_error_retry: true
    max_error_retries: 2

prompt:
  system_message: |
    You are improving the instructions in a `program.md` file used by an OpenCode
    agent inside a sandbox. The agent reads benchmark metadata and initial
    observations, then writes a Bayesian optimization strategy to
    `/workspace/output/bo_algorithm.py`.

    Revise the markdown instructions to make the agent more reliable and more
    effective across multiple benchmark problems. Preserve the same input and
    output interface: the agent must still read `/workspace/project/benchmark_problem.py`
    and write only under `/workspace/output/`, especially `bo_algorithm.py` and
    `summary.md`.

    The OpenCode agent must be told to actually create files with file-writing
    tools and verify that the required output files exist before it stops. A
    response that only explains the strategy is a failure.

    The generated `STRATEGY_SPEC` must be a plain dict accepted by
    `lila.kepler.StrategySpec(**STRATEGY_SPEC)`. Preserve and strengthen this
    schema constraint. Valid keys are: `strategy`, `n_candidates`,
    `objectives`, `constraints`, `target_metric`, `target_value`, `tolerance`,
    `punchout_radius`, `eci_radius_sampling_seed`, `ref_point`,
    `num_fantasies`, `llm`, `exploration_weight`, `candidate_pool_size`,
    `label`, and `feasibility`. Unknown keys fail evaluation, so do not add
    any keys outside this list.

    Prefer changes that improve benchmark-aware strategy selection, robustness,
    validation, and avoidance of fragile side effects. Do not ask the agent to
    call the oracle, run the optimization loop itself, install packages, or
    depend on files outside the provided sandbox.

evaluator:
  timeout: 14400
  max_retries: 0
  cascade_evaluation: false
