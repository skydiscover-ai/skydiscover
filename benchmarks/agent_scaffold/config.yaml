# Agent-scaffold discovery (#1): evolve the harness, not a single-shot function.
# Usage:
#   uv run skydiscover-run benchmarks/agent_scaffold/initial_program.py \
#     benchmarks/agent_scaffold/evaluator.py \
#     -c benchmarks/agent_scaffold/config.yaml -s best_of_n -i 50

language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000

llm:
  api_base: https://api.openai.com/v1
  models:
    - name: "gpt-5"
      weight: 1.0
  max_tokens: 16384
  timeout: 600

prompt:
  system_message: |
    You are evolving an *agent scaffold* (tool-use harness), not a one-shot solver.

    The candidate must define `run_agent(question, tools) -> str`. Tools are fixed:
      - search(query) -> entity id
      - lookup(entity, field) -> value
      - calculate(expression) -> float string
      - budget_remaining() -> int

    The knowledge base covers a handful of cities/countries (capital, country,
    currency, river, population_m, neighbor). Tasks are multi-hop questions;
    good scaffolds plan tool calls, keep short memory, and stop early.

    Optimize held-out accuracy first, then tool efficiency (fewer calls).
    Avoid crashes. Do not hard-code the held-out answers — generalize the loop
    (parse intent → resolve entities → chain lookups → optionally calculate).

evaluator:
  timeout: 60
  cascade_evaluation: false

monitor:
  enabled: true
  port: 8765
  host: "127.0.0.1"
